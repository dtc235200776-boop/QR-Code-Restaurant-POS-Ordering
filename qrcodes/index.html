<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script>if (location.port === '5500') location.replace(`${location.protocol}//${location.hostname}:3000${location.pathname}${location.search}${location.hash}`);</script>
  <title>In Mã QR Theo Bàn - Cloud POS Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    .print-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .print-header h1 {
      margin: 0 0 8px 0;
      color: #0f172a;
    }
    .btn-print {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .url-input-box {
      margin: 15px auto;
      max-width: 600px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .url-input-box input {
      width: 70%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .table-qr-card {
      background: white;
      border: 2px solid #0f172a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .table-title {
      font-size: 20px;
      font-weight: 800;
      color: #b45309;
      margin-bottom: 8px;
    }
    .qr-img {
      width: 160px;
      height: 160px;
      margin: 10px auto;
      display: block;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .instruction {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
    .qr-open-link { display: block; width: fit-content; margin: 10px auto 0; }
    .qr-demo-link { display: inline-block; margin-top: 10px; padding: 9px 13px; border-radius: 8px; color: #fff; background: #b45309; font-size: 13px; font-weight: 700; text-decoration: none; }
    .qr-demo-link:hover { background: #92400e; }
    .qr-img { margin: 0 auto; }
    .print-header p { color: #64748b; }
    @media print {
      .print-header, .url-input-box {
        display: none;
      }
      body {
        background: white;
        padding: 0;
      }
      .tables-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="print-header">
    <h1>Cloud Kitchen &amp; Cafe · Mã QR gọi món</h1>
    <p>Mỗi mã được gắn cố định với một bàn. In và đặt đúng mã tại đúng bàn.</p>
    <button class="btn-print" onclick="window.print()">🖨️ In ra giấy A4</button>
  </div>

  <div class="url-input-box">
      <label><b>Địa chỉ máy chủ cho khách quét:</b></label><br>
    <small style="color: #64748b;">Điện thoại quét QR cần cùng Wi‑Fi với máy chạy POS. Hãy kiểm tra IP trước khi in.</small><br><br>
    <input type="text" id="baseUrl" value="" placeholder="Đang lấy địa chỉ mạng của máy chủ…">
    <button class="btn-print" style="padding: 8px 14px;" onclick="renderQRCodes()">Cập nhật mã QR</button>
  </div>

  <div class="tables-grid" id="tablesContainer">
    <!-- Tạo QR cho 12 bàn mẫu -->
  </div>

  <script>
    function renderQRCodes() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const container = document.getElementById('tablesContainer');
      container.innerHTML = "";

      for (let i = 1; i <= 12; i++) {
        const tableNum = i.toString().padStart(2, '0');
        const sep = baseUrl.includes('?') ? '&' : '?';
        const orderUrl = `${baseUrl}${sep}table=${tableNum}`;
        const safeOrderUrl = orderUrl.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const targetUrl = encodeURIComponent(orderUrl);
        // Sử dụng QuickChart QR API mã nguồn mở cực nhanh
        const qrApi = `https://quickchart.io/qr?text=${targetUrl}&size=180&margin=1`;

        const card = document.createElement('div');
        card.className = 'table-qr-card';
        card.innerHTML = `
          <div class="table-title">BÀN SỐ ${tableNum}</div>
          <a class="qr-open-link" href="${safeOrderUrl}" target="_blank" rel="noopener" aria-label="Mở thử trang gọi món Bàn ${tableNum}"><img class="qr-img" src="${qrApi}" alt="Mã QR gọi món Bàn ${tableNum}"></a>
          <div class="instruction">Quét mã này để mở menu đúng bàn</div>
          <a class="qr-demo-link" href="${safeOrderUrl}" target="_blank" rel="noopener">Mở thử Bàn ${tableNum} →</a>
          <div style="font-size: 10px; color: #94a3b8; margin-top: 4px;">Cloudflare Edge Fast Load</div>
        `;
        container.appendChild(card);
      }
    }

    // Lấy IP LAN từ máy chủ để điện thoại quét QR có thể mở đúng máy tính chạy POS.
    window.addEventListener('DOMContentLoaded', async () => {
      const input = document.getElementById('baseUrl');
      try {
        const response = await fetch('/api/network', { cache: 'no-store' });
        if (!response.ok) throw new Error('Không đọc được địa chỉ máy chủ');
        const network = await response.json();
        input.value = network.url;
      } catch (_) {
        const current = new URL('/index.html', window.location.origin);
        input.value = current.href;
      }
      renderQRCodes();
    });
  </script>
</body>
</html>
