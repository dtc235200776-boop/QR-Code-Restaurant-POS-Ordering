<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>In Mã QR Theo Bàn - Cloud POS Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    .print-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .print-header h1 {
      margin: 0 0 8px 0;
      color: #0f172a;
    }
    .btn-print {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .url-input-box {
      margin: 15px auto;
      max-width: 600px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .url-input-box input {
      width: 70%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
    }
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .table-qr-card {
      background: white;
      border: 2px solid #0f172a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .table-title {
      font-size: 20px;
      font-weight: 800;
      color: #b45309;
      margin-bottom: 8px;
    }
    .qr-img {
      width: 160px;
      height: 160px;
      margin: 10px auto;
      display: block;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .instruction {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
    @media print {
      .print-header, .url-input-box {
        display: none;
      }
      body {
        background: white;
        padding: 0;
      }
      .tables-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="print-header">
    <h1>BỘ THẺ MÃ QR ĐẶT BÀN (DEMO MÔN ĐTĐM)</h1>
    <p>In trang này ra giấy hoặc đưa màn hình điện thoại quét thử trực tiếp</p>
    <button class="btn-print" onclick="window.print()">🖨️ In ra giấy A4</button>
  </div>

  <div class="url-input-box">
    <label><b>Đường dẫn gốc của ứng dụng:</b></label><br>
    <small style="color: #64748b;">(Khi deploy lên Cloudflare, nhập link của bạn ví dụ: <code>https://pos-cloud.pages.dev</code>)</small><br><br>
    <input type="text" id="baseUrl" value="http://localhost:5500/index.html">
    <button class="btn-print" style="padding: 8px 14px;" onclick="renderQRCodes()">Cập nhật mã QR</button>
  </div>

  <div class="tables-grid" id="tablesContainer">
    <!-- Sinh động 6 bàn mẫu -->
  </div>

  <script>
    function renderQRCodes() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const container = document.getElementById('tablesContainer');
      container.innerHTML = "";

      for (let i = 1; i <= 6; i++) {
        const tableNum = i.toString().padStart(2, '0');
        const sep = baseUrl.includes('?') ? '&' : '?';
        const targetUrl = encodeURIComponent(`${baseUrl}${sep}table=${tableNum}`);
        // Sử dụng QuickChart QR API mã nguồn mở cực nhanh
        const qrApi = `https://quickchart.io/qr?text=${targetUrl}&size=180&margin=1`;

        const card = document.createElement('div');
        card.className = 'table-qr-card';
        card.innerHTML = `
          <div class="table-title">BÀN SỐ ${tableNum}</div>
          <img class="qr-img" src="${qrApi}" alt="QR Bàn ${tableNum}">
          <div class="instruction">Quét mã để đặt món tức thì</div>
          <div style="font-size: 10px; color: #94a3b8; margin-top: 4px;">Cloudflare Edge Fast Load</div>
        `;
        container.appendChild(card);
      }
    }

    // Tự động nhận diện URL hiện tại nếu đang mở qua Live Server
    window.addEventListener('DOMContentLoaded', () => {
      const currentUrl = window.location.href.replace('/qrcodes/index.html', '/index.html').replace('/qrcodes/', '/index.html');
      if (currentUrl.startsWith('http')) {
        document.getElementById('baseUrl').value = currentUrl;
      }
      renderQRCodes();
    });
  </script>
</body>
</html>
