<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập nhân viên · Grand Cloud Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="staff-login-body">
  <main class="staff-login-card">
    <div class="staff-login-icon">🛎️</div>
    <p class="eyebrow">KHU VỰC NỘI BỘ KHÁCH SẠN</p>
    <h1>Đăng nhập nhân viên</h1>
    <p>Trang điều phối Buồng phòng và Lễ tân chỉ dành cho nhân viên khách sạn.</p>
    <form id="staffLogin">
      <label for="staffPin">Mã nhân viên khách sạn</label>
      <input id="staffPin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
      <button type="submit">Đăng nhập</button>
      <div id="loginError" role="alert"></div>
    </form>
    <p class="login-demo-hint">Mã PIN mặc định: <b>246810</b></p>
    <a href="index.html">← Trở về trang dịch vụ phòng</a>
  </main>
  <script src="staff-login.js"></script>
</body>
</html>
